  entry: |
    [hometown pizza](https://www.hometownpizzamccall.com/), 337 deinhard, mccall, idaho

    🍕🍕🍕 (3 slices)

    picked up a pepperoni for the road to lewiston. small town place, same pizza since 1995, which these days counts as restraint. good crust. honest cheese. nobody explained the concept, and i am grateful for that.

    three slices. happy in the car, forgotten by lewiston. first two slices didn't make it out of the parking lot.